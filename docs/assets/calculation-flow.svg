  <g fill="none" stroke="#b8aa9b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 245h22"/>
    <path d="M682 245h22"/>
    <path d="M1004 245h22"/>
  </g>
  <g fill="#b8aa9b">
    <path d="M382 245l-8-6v12z"/>
    <path d="M704 245l-8-6v12z"/>
    <path d="M1026 245l-8-6v12z"/>
  </g>
</svg>
