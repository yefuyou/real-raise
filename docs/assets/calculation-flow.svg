<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">Real Raise 真实结余计算流程</title>
  <desc id="desc">收入变化经过扣缴、固定支出和日常生活支出后，得到真正可支配的结余变化。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f3"/>
      <stop offset="1" stop-color="#f1e9de"/>
    </linearGradient>
    <linearGradient id="remainder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8b76"/>
      <stop offset="1" stop-color="#356553"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#26221e" flood-opacity=".08"/>
    </filter>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r="1" fill="#26221e" opacity=".025"/>
      <circle cx="28" cy="24" r=".8" fill="#26221e" opacity=".02"/>
    </pattern>
  </defs>

  <rect width="1440" height="440" rx="28" fill="url(#paper)"/>
  <rect width="1440" height="440" rx="28" fill="url(#grain)"/>

  <g transform="translate(72 54)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#26221e" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700">
      一次涨薪，拆成四笔看得懂的账
    </text>
    <text x="1296" y="4" text-anchor="end" dominant-baseline="hanging" fill="#7e756c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="1.5">
      LOCAL · DETERMINISTIC · PRIVATE
    </text>
  </g>

  <g transform="translate(72 132)" filter="url(#shadow)">
    <g>
      <rect width="274" height="226" rx="18" fill="#fffdf9" stroke="#ded2c4"/>
      <circle cx="44" cy="44" r="19" fill="#c68a35" opacity=".16"/>
      <path d="M35 43h18M39 36h10M39 50h10" fill="none" stroke="#9a651f" stroke-width="2.5" stroke-linecap="round"/>
      <text x="28" y="90" fill="#7e756c" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">工资增加</text>
      <text x="28" y="137" fill="#26221e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="36" font-weight="700">+ Δ 收入</text>
      <text x="28" y="184" fill="#9a651f" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">税后月收入的变化</text>
    </g>

    <g transform="translate(322)">
      <rect width="274" height="226" rx="18" fill="#fffdf9" stroke="#ded2c4"/>
      <circle cx="44" cy="44" r="19" fill="#c85c44" opacity=".14"/>
      <path d="M32 45l12-10 12 10v12H32zM40 57V47h8v10" fill="none" stroke="#a94734" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="28" y="90" fill="#7e756c" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">扣缴与固定支出</text>
      <text x="28" y="137" fill="#26221e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="36" font-weight="700">− Δ 扣缴 / 支出</text>
      <text x="28" y="184" fill="#a94734" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">个人输入优先，城市基准作参考</text>
    </g>

    <g transform="translate(644)">
      <rect width="274" height="226" rx="18" fill="#fffdf9" stroke="#ded2c4"/>
      <circle cx="44" cy="44" r="19" fill="#c85c44" opacity=".14"/>
      <path d="M32 40h24l-3 15H35zM38 40l3-7M50 40l-3-7" fill="none" stroke="#a94734" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="90" fill="#7e756c" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">其他支出变化</text>
      <text x="28" y="137" fill="#26221e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="36" font-weight="700">− Δ 支出</text>
      <text x="28" y="184" fill="#a94734" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">按你的消费结构估算</text>
    </g>

    <g transform="translate(966)">
      <rect width="330" height="226" rx="18" fill="url(#remainder)" stroke="#356553"/>
      <circle cx="44" cy="44" r="19" fill="#fff" opacity=".14"/>
      <path d="M34 45l7 7 14-17" fill="none" stroke="#fffaf4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="90" fill="#dcebe4" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">真实结余变化</text>
      <text x="28" y="137" fill="#fffaf4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="34" font-weight="700">= 真正留下的</text>
      <text x="28" y="184" fill="#dcebe4" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">同时给出每月与每年结果</text>
    </g>
